<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pat - Zentif — Santiago Cabrini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EAE6DC;
    --paper-deep:#DFDACB;
    --ink:#1A1B1E;
    --line:#C9C3B4;
    --stone:#6E6A5E;
    --blueprint:#2C4870;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Source Serif 4', serif;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; }
  .display{ font-family:'Archivo', sans-serif; font-weight:600; letter-spacing:-0.01em; }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  :focus-visible{ outline:2px solid var(--blueprint); outline-offset:3px; }

  header{
    position:fixed;
    top:0; left:0; right:0;
    z-index:50;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:22px 40px;
    background:rgba(234,230,220,0.88);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  header .name{ font-size:15px; font-weight:600; text-decoration:none; }
  header nav{ display:flex; gap:28px; font-size:14px; color:var(--stone); }
  header nav a{ text-decoration:none; transition:color .15s ease; }
  header nav a:hover{ color:var(--ink); }

  main{ padding-top:88px; }
  section{ padding:56px 40px; max-width:1100px; margin:0 auto; }

  .back{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:14px;
    color:var(--stone);
    text-decoration:none;
    margin-bottom:24px;
    transition:color .15s ease;
  }
  .back:hover{ color:var(--blueprint); }

  .kicker{ display:block; font-size:13px; color:var(--stone); margin-bottom:16px; }
  h1{
    font-family:'Archivo', sans-serif;
    font-weight:600;
    letter-spacing:-0.01em;
    font-size:clamp(36px, 6vw, 68px);
    line-height:1.02;
    margin:0 0 28px;
  }

  .hero-image{
    width:100%;
    aspect-ratio:16/10;
    background:var(--paper-deep);
    border:1px solid var(--line);
    overflow:hidden;
    margin-bottom:40px;
    clip-path:inset(0 0 100% 0);
    animation:reveal 1s cubic-bezier(.16,1,.3,1) .1s forwards;
  }
  .hero-image img{
    width:100%; height:100%; object-fit:cover; display:block;
    transform:scale(1.08);
    animation:settle 1.1s cubic-bezier(.16,1,.3,1) .1s forwards;
  }
  @keyframes reveal{ to{ clip-path:inset(0 0 0% 0); } }
  @keyframes settle{ to{ transform:scale(1); } }
  @media (prefers-reduced-motion: reduce){
    .hero-image, .hero-image img{ animation:none; clip-path:none; transform:none; }
  }

  .description{
    font-size:18px;
    line-height:1.7;
    color:var(--ink);
    max-width:64ch;
    margin:0 0 8px;
  }

  .gallery{ border-top:1px solid var(--line); padding-top:8px; }
  .gallery-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:24px; }
  .gallery-grid figure{
    margin:0;
    aspect-ratio:4/3;
    background:var(--paper-deep);
    border:1px solid var(--line);
    overflow:hidden;
    position:relative;
    cursor:pointer;
  }
  .gallery-grid figure img{
    width:100%; height:100%; object-fit:cover; object-position:center; display:block;
    transition:transform .5s cubic-bezier(.16,1,.3,1);
  }
  .gallery-grid figure:hover img{ transform:scale(1.045); }
  .gallery-grid figure::after{
    content:"Ver";
    position:absolute;
    top:14px; right:14px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--paper);
    background:rgba(26,27,30,0.72);
    border:1px solid var(--line);
    padding:5px 10px;
    opacity:0;
    transform:translateY(-4px);
    transition:opacity .2s ease, transform .2s ease;
    pointer-events:none;
  }
  .gallery-grid figure:hover::after{ opacity:1; transform:translateY(0); }

  .lightbox{
    position:fixed; inset:0; z-index:100;
    background:rgba(20,19,17,0.92);
    display:flex; align-items:center; justify-content:center;
    opacity:0; visibility:hidden;
    transition:opacity .25s ease;
  }
  .lightbox.is-open{ opacity:1; visibility:visible; }
  .lightbox-figure{
    max-width:min(1100px, 88vw); max-height:82vh;
    display:flex; flex-direction:column; gap:14px; align-items:center;
  }
  .lightbox-figure img{
    max-width:100%; max-height:74vh; object-fit:contain;
    border:1px solid rgba(234,230,220,0.2);
    opacity:0; transform:translateY(6px);
    transition:opacity .25s ease, transform .25s ease;
  }
  .lightbox.is-open .lightbox-figure img{ opacity:1; transform:translateY(0); }
  .lightbox-counter{ font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--paper); opacity:0.7; }
  .lightbox-close, .lightbox-prev, .lightbox-next{
    position:absolute;
    background:transparent;
    border:1px solid rgba(234,230,220,0.3);
    color:var(--paper);
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    cursor:pointer;
    padding:10px 14px;
    transition:border-color .15s ease, color .15s ease;
  }
  .lightbox-close:hover, .lightbox-prev:hover, .lightbox-next:hover{ color:#7FA3D6; border-color:#7FA3D6; }
  .lightbox-close{ top:24px; right:24px; }
  .lightbox-prev{ left:24px; top:50%; transform:translateY(-50%); }
  .lightbox-next{ right:24px; top:50%; transform:translateY(-50%); }

  .lightbox-thumbs{
    display:flex; gap:8px; margin-top:4px;
    max-width:min(1100px, 88vw); overflow-x:auto; padding-bottom:4px;
  }
  .lightbox-thumbs::-webkit-scrollbar{ height:4px; }
  .lightbox-thumbs::-webkit-scrollbar-thumb{ background:rgba(234,230,220,0.3); }
  .lightbox-thumbs img{
    width:64px; height:48px; object-fit:cover; flex-shrink:0;
    border:1px solid rgba(234,230,220,0.2);
    opacity:0.45; cursor:pointer;
    transition:opacity .15s ease, border-color .15s ease;
  }
  .lightbox-thumbs img:hover{ opacity:0.75; }
  .lightbox-thumbs img.is-active{ opacity:1; border-color:#7FA3D6; }

  .nav-project{
    border-top:1px solid var(--line);
    display:flex; justify-content:space-between; font-size:14px;
  }
  .nav-project a{ text-decoration:none; color:var(--stone); transition:color .15s ease; }
  .nav-project a:hover{ color:var(--blueprint); }

  .contact{ border-top:1px solid var(--line); }
  .contact h2{ font-family:'Archivo', sans-serif; font-weight:600; font-size:28px; margin:0 0 32px; }
  .contact-links{ display:flex; flex-direction:column; gap:14px; }
  .contact-item{ display:flex; align-items:baseline; gap:16px; }
  .contact-item .contact-label{ font-size:13px; color:var(--stone); width:76px; flex-shrink:0; font-family:'IBM Plex Mono', monospace; }
  .contact-links a{
    font-family:'Archivo', sans-serif;
    font-weight:600;
    font-size:clamp(16px, 2.5vw, 22px);
    text-decoration:none;
    width:fit-content;
    border-bottom:1px solid transparent;
    transition:border-color .15s ease, color .15s ease;
  }
  .contact-links a:hover{ color:var(--blueprint); border-color:var(--blueprint); }
  .contact-meta{
    margin-top:40px; display:flex; justify-content:space-between;
    color:var(--stone); font-size:13px; flex-wrap:wrap; gap:8px;
    font-family:'IBM Plex Mono', monospace;
  }

  @media (max-width: 780px){
    header{ padding:18px 20px; }
    section{ padding:40px 20px; }
    .gallery-grid{ grid-template-columns:1fr; }
    .lightbox-prev{ left:12px; padding:8px 12px; }
    .lightbox-next{ right:12px; padding:8px 12px; }
    .lightbox-close{ top:14px; right:14px; }
    .gallery-grid figure::after{ content:none; }
    .lightbox-thumbs{ max-width:92vw; }
  }
</style>
</head>
<body>

<header>
  <a class="name display" href="index.html">Santiago Cabrini</a>
  <nav>
    <a href="fotografia.html">Volver a Fotografía</a>
    <a href="#contacto">Contacto</a>
  </nav>
</header>

<main>

  <section>
    <a class="back" href="fotografia.html">← Volver a Fotografía</a>
    <span class="kicker mono">Fotografía — Serie</span>
    <h1>Pat - Zentif</h1>

    <div class="hero-image">
      <!-- Reemplazá esta línea por tu foto principal de la serie -->
      <img src="imagenes/ZE.png" alt="Pat - Zentif">
    </div>

    <!-- Reemplazá este párrafo por el texto real de la serie -->
    <p class="description">Registro fotográfico de obra finalizada — Zenfit.
Proyecto del Estudio Pat</p>
  </section>

  <section class="gallery">
    <div class="gallery-grid">
      <!-- Sumá o sacá figure según cuántas fotos tenga esta serie -->
      <figure><img src="imagenes/ZE1.jpg" alt="Pat - Zentif 1"></figure>
      <figure><img src="imagenes/ZE2.jpg" alt="Pat - Zentif 2"></figure>
      <figure><img src="imagenes/ZE3.jpg" alt="Pat - Zentif 3"></figure>
      <figure><img src="imagenes/ZE4.jpg" alt="Pat - Zentif 4"></figure>
      <figure><img src="imagenes/ZE5.jpg" alt="Pat - Zentif 3"></figure>
      <figure><img src="imagenes/ZE6.jpg" alt="Pat - Zentif 4"></figure>
      <figure><img src="imagenes/ZE7.jpg" alt="Pat - Zentif 3"></figure>
      <figure><img src="imagenes/ZE8.jpg" alt="Pat - Zentif 4"></figure>
    
    </div>
  </section>

  <section class="nav-project">
    <a href="fotografia.html">← Volver a Fotografía</a>
  </section>

  <section id="contacto" class="contact">
    <h2>Contacto</h2>
    <div class="contact-links">
      <div class="contact-item">
        <span class="contact-label">Mail</span>
        <a href="mailto:tatocabrini14@gmail.com">tatocabrini14@gmail.com</a>
      </div>
      <div class="contact-item">
        <span class="contact-label">Instagram</span>
        <a href="https://instagram.com/tat._.o" target="_blank" rel="noopener">@tat._.o</a>
      </div>
    </div>
    <div class="contact-meta">
      <span>Buenos Aires, Argentina</span>
      <span id="year"></span>
    </div>
  </section>

</main>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lightbox-close" id="lightboxClose" aria-label="Cerrar">Cerrar ✕</button>
  <button class="lightbox-prev" id="lightboxPrev" aria-label="Imagen anterior">←</button>
  <div class="lightbox-figure">
    <img id="lightboxImg" src="" alt="">
    <span class="lightbox-counter mono" id="lightboxCounter"></span>
  </div>
  <div class="lightbox-thumbs" id="lightboxThumbs"></div>
  <button class="lightbox-next" id="lightboxNext" aria-label="Imagen siguiente">→</button>
</div>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  (function(){
    const figures = Array.from(document.querySelectorAll('.gallery-grid figure'));
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const counter = document.getElementById('lightboxCounter');
    const thumbsRail = document.getElementById('lightboxThumbs');
    let current = 0;

    const thumbs = figures.map((fig, i) => {
      const src = fig.querySelector('img').src;
      const t = document.createElement('img');
      t.src = src;
      t.alt = '';
      t.addEventListener('click', () => open(i));
      thumbsRail.appendChild(t);
      return t;
    });

    function open(index){
      current = index;
      const img = figures[current].querySelector('img');
      lightboxImg.src = img.src;
      lightboxImg.alt = img.alt;
      counter.textContent = (current + 1) + ' / ' + figures.length;
      thumbs.forEach((t, i) => t.classList.toggle('is-active', i === current));
      thumbs[current].scrollIntoView({ block:'nearest', inline:'center', behavior:'smooth' });
      lightbox.classList.add('is-open');
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }
    function close(){
      lightbox.classList.remove('is-open');
      lightbox.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }
    function show(delta){
      current = (current + delta + figures.length) % figures.length;
      open(current);
    }

    figures.forEach((fig, i) => {
      fig.addEventListener('click', () => open(i));
    });
    document.getElementById('lightboxClose').addEventListener('click', close);
    document.getElementById('lightboxPrev').addEventListener('click', () => show(-1));
    document.getElementById('lightboxNext').addEventListener('click', () => show(1));
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) close(); });

    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('is-open')) return;
      if (e.key === 'Escape') close();
      if (e.key === 'ArrowLeft') show(-1);
      if (e.key === 'ArrowRight') show(1);
    });

    let touchStartX = 0;
    lightbox.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].clientX;
    }, { passive:true });
    lightbox.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 50) show(dx > 0 ? -1 : 1);
    }, { passive:true });
  })();
</script>

</body>
</html>
